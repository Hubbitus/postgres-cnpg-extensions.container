name: build-and-publish

on:
  push:
    branches: [main]
    tags: ['v*', 'pg*-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: docker.io/hubbitus/postgres-cnpg-extensions

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write   # cosign keyless
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=pg18-latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=raw,value=pg18-{{date 'YYYYMMDD'}}-{{sha}},enable={{is_default_branch}}
            type=sha,prefix=pg18-,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        if: github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: '1'
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            cosign sign --yes "${tag}@${DIGEST}"
          done

  smoke:
    runs-on: ubuntu-24.04
    needs: []
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (amd64, load)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: pcne:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run standalone container
        run: |
          docker run -d --rm --name pcne-smoke \
              -e POSTGRES_PASSWORD=smoke \
              -e POSTGRES_USER=smoke \
              -e POSTGRES_DB=smoke \
              pcne:smoke \
              -c config_file=/etc/postgresql-cnpg-extensions.conf

      - name: Wait for pg_isready (max 60s)
        run: |
          for i in $(seq 1 60); do
              if docker exec pcne-smoke pg_isready -U smoke -d smoke -q; then
                  echo "ready after ${i}s"; exit 0
              fi
              sleep 1
          done
          echo "pg_isready timeout"; docker logs pcne-smoke; exit 1

      - name: Assert PG major = 18
        run: |
          v=$(docker exec pcne-smoke psql -U smoke -d smoke -tAc "SHOW server_version_num")
          echo "server_version_num=$v"
          test "${v%????}" = "18" || { echo "expected PG 18, got $v"; exit 1; }

      - name: Assert extensions load
        run: |
          docker exec pcne-smoke psql -U smoke -d smoke -v ON_ERROR_STOP=1 <<'SQL'
              CREATE EXTENSION vector;
              CREATE EXTENSION temporal_tables;
              CREATE EXTENSION pg_jsonschema;
          SQL
          # pg_cron requires creation in the database named by cron.database_name (default: postgres)
          docker exec pcne-smoke psql -U smoke -d postgres -v ON_ERROR_STOP=1 -c "CREATE EXTENSION pg_cron;"
          docker exec pcne-smoke psql -U smoke -d smoke -tAc \
              "SELECT extname || ' ' || extversion FROM pg_extension WHERE extname IN ('vector','temporal_tables','pg_jsonschema') ORDER BY extname;"
          docker exec pcne-smoke psql -U smoke -d postgres -tAc \
              "SELECT extname || ' ' || extversion FROM pg_extension WHERE extname = 'pg_cron';"

      - name: Dump logs on failure
        if: failure()
        run: docker logs pcne-smoke || true

      - name: Cleanup
        if: always()
        run: docker rm -f pcne-smoke || true

  smoke-cnpg:
    runs-on: ubuntu-24.04
    needs: []
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (amd64, load)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: pcne:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: pcne
          wait: 60s

      - name: Load image into kind
        run: kind load docker-image pcne:smoke --name pcne

      - name: Install CNPG operator (v1.30.0)
        run: |
          kubectl apply --server-side -f \
              https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.30/releases/cnpg-1.30.0.yaml
          kubectl -n cnpg-system rollout status deploy/cnpg-controller-manager --timeout=180s

      - name: Apply Cluster CR
        run: |
          cat <<'YAML' | kubectl apply -f -
          apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          metadata:
            name: pcne-smoke
          spec:
            instances: 1
            imageName: pcne:smoke
            imagePullPolicy: Never
            postgresql:
              shared_preload_libraries:
                - pg_cron
              parameters:
                cron.database_name: app
            bootstrap:
              initdb:
                database: app
                owner: app
                postInitApplicationSQL:
                  - CREATE EXTENSION IF NOT EXISTS vector;
                  - CREATE EXTENSION IF NOT EXISTS pg_jsonschema;
                  - CREATE EXTENSION IF NOT EXISTS temporal_tables;
                postInitSQL:
                  - CREATE EXTENSION IF NOT EXISTS pg_cron;
            storage:
              size: 1Gi
          YAML

      - name: Wait for cluster healthy (max 5 min)
        run: |
          for i in $(seq 1 60); do
              phase=$(kubectl get cluster pcne-smoke -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
              echo "attempt ${i}: phase=${phase}"
              if [ "$phase" = "Cluster in healthy state" ]; then
                  echo "healthy after $((i*5))s"; exit 0
              fi
              sleep 5
          done
          echo "cluster did not become healthy"
          kubectl get cluster pcne-smoke -o yaml
          kubectl -n default get pods
          exit 1

      - name: Assert extensions loaded (via operator-managed init)
        run: |
          kubectl exec pcne-smoke-1 -c postgres -- psql -U postgres -d app -tAc \
              "SELECT extname || ' ' || extversion FROM pg_extension WHERE extname IN ('vector','temporal_tables','pg_jsonschema') ORDER BY extname;" \
              | tee /tmp/exts.txt
          grep -q '^vector '          /tmp/exts.txt || { echo "vector missing"; exit 1; }
          grep -q '^temporal_tables ' /tmp/exts.txt || { echo "temporal_tables missing"; exit 1; }
          grep -q '^pg_jsonschema '   /tmp/exts.txt || { echo "pg_jsonschema missing"; exit 1; }
          kubectl exec pcne-smoke-1 -c postgres -- psql -U postgres -d app -tAc \
              "SELECT extname || ' ' || extversion FROM pg_extension WHERE extname = 'pg_cron';" \
              | grep -q '^pg_cron ' || { echo "pg_cron missing"; exit 1; }

      - name: Dump logs on failure
        if: failure()
        run: |
          kubectl get cluster pcne-smoke -o yaml || true
          kubectl -n default describe pod pcne-smoke-1 || true
          kubectl -n default logs pcne-smoke-1 -c postgres --tail=200 || true
          kubectl -n cnpg-system logs -l app.kubernetes.io/name=cloudnative-pg --tail=200 || true
